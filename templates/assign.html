<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Workout Splits</title>
</head>
<body>
<h2>Assigned Splits</h2>
<table>
  <tr><th>Days</th><th>Split</th><th>Assigned</th></tr>
  {% for row in val %}
  <tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
  </tr>
  {% else %}
  <tr><td colspan="3">No splits assigned yet.</td></tr>
  {% endfor %}
</table>
<form method="post">
    <label>Number of Days:</label>
    <input type="number" name="num_of_days" required>
    <label>Suitable Split:</label>
    <input type="text" name="split" required>
    <button type="submit">Submit Split</button>
</form>
<a href="/trainer/client/{{ client_id }}">Back</a>
</body>
</html>
