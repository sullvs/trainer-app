<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Workout Splits</title>
</head>
<body>

<ul>
    {% for row in val %}
        <li>{{ row[0] }} days — {{ row[1] }} (assigned {{ row[2] }})</li>
    {% else %}
        <li>No splits assigned yet.</li>
    {% endfor %}
</ul>
<form method="post">
    <label>Number of Days:</label>
    <input type="number" name="num_of_days">
    <label>Suitable Split:</label>
    <input type="text" name="split">
    <button type="submit">Submit Split</button>
</form>
</body>
</html>
